<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LazyLedger Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="brand"><img src="resources/PROFILE%20ICON.png" alt="Logo" width="30"> LAZY LEDGER</div>
      <div class="user-profile">
        <!-- Added explicit inline width fallbacks to stop the image from expanding the flex container -->
        <img src="resources/PROFILE%20ICON.png" alt="User" width="40" height="40">
        <div>
          <div style="font-weight: 800; color: var(--terracotta); font-size: 14px;">Sydney Magdaluyo</div>
          <div style="font-size: 12px; color: var(--text-dark);">Customer</div>
        </div>
      </div>
      <nav id="sidebarNav">
        <button class="nav-link active" data-target="tabHome"><img src="resources/HOME%20ICON.png" alt="Home" width="20"> Home</button>
        <button class="nav-link" data-target="tabAccounts"><img src="resources/ACCOUNTS%20ICON.png" alt="Accounts" width="20"> Accounts</button>
        <button class="nav-link" data-target="tabTransactions"><img src="resources/TRANSACTIONS%20ICON.png" alt="Transactions" width="20"> Transactions</button>
        <button class="nav-link" data-target="tabBudgets"><img src="resources/BUDGET%20ICON.png" alt="Budgets" width="20"> Budgets</button>
        <button class="nav-link" data-target="tabStats"><img src="resources/STATS%20ICON.png" alt="Stats" width="20"> Stats</button>
      </nav>
      <a href="index.html" class="nav-link logout"><img src="resources/LOGOUT%20ICON.png" alt="Logout" width="20"> Logout</a>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div>
          <div class="card-label" id="mainHeader">LEFT TO SPEND</div>
          <div class="card-value text-red" id="mainValue">₱12,450.00</div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-primary" id="currencyBtn" style="background:var(--white); border:2px solid var(--terracotta);">View in USD</button>
          <button class="btn-primary" id="addEntryBtn"><img src="resources/ADD%20ICON.png" width="14" style="vertical-align: middle; margin-right: 6px;"> ADD TRANSACTION</button>
        </div>
      </div>

      <!-- Home Tab -->
      <section id="tabHome" class="tab-section">
        <div class="summary-grid">
          <div class="card">
            <div class="card-label">INCOME</div>
            <div class="card-value text-green">+₱17,550.00</div>
          </div>
          <div class="card">
            <div class="card-label">EXPENSES</div>
            <div class="card-value text-red">-₱5,100.00</div>
          </div>
        </div>
      </section>

      <!-- Accounts Tab -->
      <section id="tabAccounts" class="tab-section" style="display:none;">
        <div class="summary-grid">
          <div class="card"><div class="card-label">CASH</div><div class="card-value">₱3,200.00</div></div>
          <div class="card"><div class="card-label">BDO SAVINGS</div><div class="card-value">₱48,900.00</div></div>
        </div>
      </section>

      <!-- Transactions Tab -->
      <section id="tabTransactions" class="tab-section" style="display:none;">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
            <h3 class="card-label">ALL TRANSACTIONS</h3>
            <div style="display:flex; gap:8px;">
              <img src="resources/SEARCH%20ICON.png" alt="Search" width="24" style="cursor: pointer;">
              <img src="resources/FILTER%20ICON.png" alt="Filter" width="24" style="cursor: pointer;">
            </div>
          </div>
          <table>
            <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
            <tbody id="transactionList"><tr><td colspan="3">Loading records...</td></tr></tbody>
          </table>
        </div>
      </section>

      <!-- Budgets Tab -->
      <section id="tabBudgets" class="tab-section" style="display:none;">
        <div class="card">
          <h3 class="card-label" style="margin-bottom: 16px;">MONTHLY BUDGETS</h3>
          <p style="color: var(--text-muted);">No budgets set.</p>
        </div>
      </section>

      <!-- Stats Tab -->
      <section id="tabStats" class="tab-section" style="display:none;">
        <div class="card">
          <h3 class="card-label" style="margin-bottom: 16px;">SPENDING STATS</h3>
          <p style="color: var(--text-muted);">No stats available.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
