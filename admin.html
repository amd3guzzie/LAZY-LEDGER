<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - LazyLedger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="sidebar">
      <div class="brand"><img src="resources/PROFILE%20ICON.png" alt="Logo" width="30"> LAZY LEDGER</div>
      <div class="user-profile">
        <img src="resources/PROFILE%20ICON.png" alt="User">
        <div>
          <div style="font-weight: 800; color: var(--terracotta); font-size: 14px;">System Admin</div>
        </div>
      </div>
      <nav>
        <button class="nav-link active"><img src="resources/ACCOUNTS%20ICON.png" alt="Users"> User Directory</button>
      </nav>
      <a href="index.html" class="nav-link logout"><img src="resources/LOGOUT%20ICON.png" alt="Logout"> Logout</a>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div>
          <div class="card-label">SYSTEM STATUS</div>
          <div class="card-value text-green">Healthy</div>
        </div>
      </div>

      <div class="card">
        <h3 class="card-label" style="margin-bottom:16px;">REGISTERED USERS</h3>
        <table>
          <thead><tr><th>Email</th><th>First Name</th><th>Role</th></tr></thead>
          <tbody id="userTable"><tr><td colspan="3">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="admin.js"></script>
</body>
</html>
