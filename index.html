<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LazyLedger - Manage Your Finances</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: block;">
  <nav style="display: flex; justify-content: space-between; align-items: center; padding: 24px 48px;">
    <div class="brand" style="margin-bottom: 0;">
      <img src="resources/PROFILE%20ICON.png" alt="Logo" width="30" style="margin-right: 10px;"> LAZY LEDGER
    </div>
    <div>
      <button class="btn-outline" id="openLoginBtn">Login</button>
    </div>
  </nav>

  <div style="display: flex; padding: 60px 48px; align-items: center; max-width: 1200px; margin: 0 auto;">
    <div style="flex: 1;">
      <h1 style="font-size: 48px; color: var(--terracotta); line-height: 1.1; margin-bottom: 20px;">MANAGE YOUR<br>FINANCES,<br>EFFORTLESSLY.</h1>
      <p style="margin-bottom: 30px; font-weight: 600; color: var(--text-dark); max-width: 400px;">
        LazyLedger is a student-built personal finance tracker designed to make monitoring income, tracking expenses, and budgeting completely stress-free.
      </p>
      <button class="btn-primary" id="openSignupBtn">GET STARTED ></button>
    </div>
    <div style="flex: 1; text-align: right;">
      <img src="resources/HERO%20SECTION.png" alt="Hero Interface" style="max-width: 100%; width: 450px;">
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay hidden" id="loginModal">
    <div class="modal-content">
      <h2 style="color: var(--terracotta); margin-bottom: 20px;">
        <img src="resources/PROFILE%20ICON.png" width="30" style="margin-right: 10px;"> LAZY LEDGER
      </h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address*</label>
          <input type="email" id="loginEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password*</label>
          <input type="password" id="loginPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 10px; width: 100%;">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal-overlay hidden" id="signupModal">
    <div class="modal-content">
      <h2 style="color: var(--terracotta); margin-bottom: 20px;">SIGN UP</h2>
      <form id="signupForm">
        <div class="form-group">
          <label>Full Name*</label>
          <input type="text" id="regName" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email Address*</label>
          <input type="email" id="regEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password*</label>
          <input type="password" id="regPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 10px; width: 100%;">SIGN UP</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
